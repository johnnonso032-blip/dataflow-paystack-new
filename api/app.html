<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quicky Data</title>
<style>
:root{--p:#6c3df4;--bg:#f6f3ff;--card:#fff;--text:#1b1630;--mut:#7a7394;--line:#ece8f8;--ok:#12a36b;--bad:#e5484d;--warn:#e8a317}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.av{width:38px;height:38px;border-radius:50%;background:#e4dbff;color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;border:0;font-size:16px}
.av.pillbtn{width:auto;border-radius:99px;padding:0 14px;font-size:13px}
.hello{margin:14px 0 12px;color:var(--mut)}
.wallet{background:linear-gradient(135deg,#6c3df4,#a48bff);color:#fff;border-radius:22px;padding:18px}
.wallet small{opacity:.85}
.amt{font-size:30px;font-weight:800;margin:4px 0 12px}
.fund{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(108,61,244,.07)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:12px;color:var(--text);padding:0}
.ico{width:48px;height:48px;border-radius:15px;background:#efe9ff;display:flex;align-items:center;justify-content:center;font-size:23px}
.soon{opacity:.5}
.promo{background:#fff6d6;border-radius:18px;padding:14px;margin-top:14px;font-size:14px}
h3{margin:20px 0 0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
h3 button{background:none;border:0;color:var(--p);font-weight:600;font-size:13px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:#efe9ff;display:flex;align-items:center;justify-content:center}
.row .m{flex:1;min-width:0;font-size:14px}
.row .m small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.row .r{text-align:right;font-size:14px;font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:600;color:#fff;padding:3px 9px;border-radius:99px;margin-top:4px}
.success{background:var(--ok)}.pending{background:var(--warn)}.failed{background:var(--bad)}.abandoned{background:#8d88a3}
.re{background:none;border:1px solid var(--p);color:var(--p);border-radius:10px;padding:3px 9px;font-size:11px;margin-top:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.sheet{position:fixed;inset:0;background:rgba(20,10,50,.5);display:flex;align-items:flex-end;z-index:9}
.panel{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto}
.hide{display:none}
.chips,.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.chip,.plan{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-size:14px;color:var(--text)}
.chip.on,.plan.on{border-color:var(--p);background:#f2edff}
.plan b{display:block;font-size:17px;margin-top:4px}
.plan s{color:var(--mut);font-size:12px;font-weight:400;margin-left:4px}
label{font-size:13px;color:var(--mut)}
input{width:100%;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:14px;margin:6px 0 12px}
.go{width:100%;background:var(--p);color:#fff;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700}
.go.sec{background:#efe9ff;color:var(--p);margin-top:10px}
.go[disabled]{opacity:.6}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.x{float:right;background:none;border:0;font-size:24px}
.tabs2{display:flex;gap:8px;margin:12px 0}
.tabs2 button{flex:1;padding:11px;border:0;border-radius:12px;background:#efe9ff;color:var(--p);font-weight:700}
.tabs2 button.on{background:var(--p);color:#fff}
.cb{width:auto;margin:0 8px 0 0;display:inline}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1b1630;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.k{background:#f6f3ff;border-radius:14px;padding:12px}.k small{display:block;color:var(--mut);font-size:12px}.k b{font-size:18px}
.note{font-size:13px;color:var(--mut);line-height:1.5;margin:8px 0}
ul.ben{padding-left:18px;margin:10px 0;font-size:14px;line-height:1.7}
.rcard{background:linear-gradient(135deg,#1b1630,#4b2fb3);color:#fff;border-radius:18px;padding:16px}
.rcard .amt{margin:4px 0 10px}
</style></head>
<body>
<div class="toast hide" id="toast"></div>
<div class="wrap">
 <div class="top">
  <div class="brand"><svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="#6c3df4"/><rect x="7" y="19" width="4" height="8" rx="1.5" fill="#fff"/><rect x="13" y="15" width="4" height="12" rx="1.5" fill="#fff"/><rect x="19" y="11" width="4" height="16" rx="1.5" fill="#fff"/><rect x="25" y="7" width="4" height="20" rx="1.5" fill="#fff"/></svg><span id="brand"></span></div>
  <button class="av pillbtn" id="avbtn">Log in</button>
 </div>
 <div class="hello" id="hello">Hi, <b>Guest</b> &#128075;</div>
 <div class="wallet"><small>Wallet balance</small><div class="amt" id="bal">&#8358;0.00</div><button class="fund" id="fundbtn">Log in / Sign up</button></div>
 <div class="card"><div class="grid">
  <button class="tile" data-m="airtime"><span class="ico">&#128222;</span>Airtime</button>
  <button class="tile" data-m="data"><span class="ico">&#128246;</span>Data</button>
  <button class="tile soon" disabled><span class="ico">&#9889;</span>Electricity</button>
  <button class="tile soon" disabled><span class="ico">&#128250;</span>Cable TV</button>
  <button class="tile soon" disabled><span class="ico">&#127760;</span>Internet</button>
  <button class="tile soon" disabled><span class="ico">&#127873;</span>Cashback</button>
  <button class="tile" id="rtile"><span class="ico">&#129309;</span>Resellers</button>
  <button class="tile soon" disabled><span class="ico">&#8943;</span>More</button>
 </div></div>
 <div class="promo">&#127873; <b>Cashback</b> for customers is coming soon. Buy airtime and data now.</div>
 <h3 id="hist">Recent transactions <button id="all">See all</button></h3>
 <div class="card" id="list"></div>
</div>
<nav><button id="navHome">&#127968;<span>Home</span></button><button id="navHist">&#128221;<span>History</span></button></nav>

<div class="sheet hide" id="sheet"><div class="panel">
 <button class="x" id="close">&times;</button>
 <h2 id="stitle" style="margin:0 0 6px"></h2>
 <div class="note hide" id="rnote">Reseller prices applied. Pay from your wallet.</div>
 <label>Network</label><div class="chips" id="chips"></div>
 <label>Choose amount</label><div class="plans" id="plans"></div>
 <label for="phone">Phone number</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="08012345678">
 <label for="email">Email (for receipt)</label><input id="email" type="email" placeholder="you@example.com">
 <button class="go" id="pay">Pay with Paystack</button>
 <button class="go sec" id="wpay">Pay from wallet</button>
 <div class="msg" id="msg"></div>
</div></div>

<div class="sheet hide" id="fsheet"><div class="panel">
 <button class="x" id="fclose">&times;</button>
 <h2 style="margin:0 0 6px">Fund Wallet</h2>
 <label>Choose amount</label>
 <div class="plans" id="famts"></div>
 <label for="famt">Or type an amount (minimum &#8358;100)</label>
 <input id="famt" type="tel" inputmode="numeric" placeholder="e.g. 3000">
 <label for="femail">Email (for receipt)</label>
 <input id="femail" type="email" placeholder="you@example.com">
 <button class="go" id="fpay">Pay with Paystack</button>
 <div class="msg" id="fmsg"></div>
</div></div>

<div class="sheet hide" id="rsheet"><div class="panel">
 <button class="x" id="rclose">&times;</button>
 <h2 style="margin:0 0 6px">Resellers</h2>
 <div id="rbody"></div>
</div></div>

<div class="sheet hide" id="asheet"><div class="panel">
 <button class="x" id="aclose">&times;</button>
 <h2 style="margin:0">Welcome</h2>
 <div class="tabs2"><button id="tabIn" class="on">Log in</button><button id="tabUp">Sign up</button></div>
 <div id="nameWrap" class="hide"><label for="aname">Your name</label><input id="aname" autocomplete="name" placeholder="e.g. Ada Obi"></div>
 <label for="aphone">Phone number</label><input id="aphone" type="tel" inputmode="numeric" maxlength="11" placeholder="08012345678">
 <label for="apass">Password (at least 6 characters)</label><input id="apass" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
 <label><input class="cb" id="ashow" type="checkbox">Show password</label>
 <button class="go" id="ago" style="margin-top:12px">Log in</button>
 <div class="msg" id="amsg"></div>
</div></div>

<div class="sheet hide" id="csheet"><div class="panel">
 <button class="x" id="cclose">&times;</button>
 <h2 style="margin:0 0 6px">My account</h2>
 <div style="font-size:16px"><b id="cname"></b></div>
 <div style="color:#7a7394;margin-top:4px" id="cphone"></div>
 <h3 style="margin-top:16px">Recent wallet activity</h3>
 <div id="whist"></div>
 <button class="go sec" id="cout">Log out</button>
</div></div>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="/lib/config.js"></script>
<script src="/lib/prices.js"></script>
<script>
(function(){
var BRAND="Quicky Data";
var C=window.DATAFLOW_CONFIG,P=window.DATAFLOW_PRICES,KEY="dataflow_orders_v1";
var mode="airtime",net=null,planId=null,showAll=false,paying=false,tries={};
var token="",user=null,amode="in",hist=[],balance=0;
var rs={status:"none",airtimePct:1,dataPct:1};
function $(id){return document.getElementById(id)}
function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}
function naira(n){return "\u20A6"+Number(n).toLocaleString()}
function money(n){return "\u20A6"+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function save(l){try{localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}}
function upsert(o){var l=load(),i=l.findIndex(function(x){return x.reference===o.reference});if(i>=0)Object.assign(l[i],o);else l.unshift(o);save(l)}
function dropLocal(ref){save(load().filter(function(x){return x.reference!==ref}))}
function say(t){$("msg").textContent=t||""}
function amsg(t){$("amsg").textContent=t||""}
function fmsg(t){$("fmsg").textContent=t||""}
var tt;function note(t){var e=$("toast");e.textContent=t;e.classList.remove("hide");clearTimeout(tt);tt=setTimeout(function(){e.classList.add("hide")},4500)}
document.title=BRAND;$("brand").textContent=BRAND;
function when(d){try{return new Date(d).toLocaleString([],{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function newRef(){var a="abcdefghijklmnopqrstuvwxyz0123456789",s="";for(var i=0;i<16;i++)s+=a.charAt(Math.floor(Math.random()*a.length));return s}

try{token=localStorage.getItem("dfng_token")||"";user=JSON.parse(localStorage.getItem("dfng_user")||"null")}catch(e){}
function post(path,action,data){
  return fetch(path,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(Object.assign({action:action},data||{}))}).then(function(r){return r.json()});
}
function call(a,d){return post("/api/account",a,d)}
function wcall(a,d){return post("/api/wallet",a,d)}

/* ---------- reseller pricing (display only; the server sets the real price) ---------- */
function shown(p){
  if(rs.status!=="active")return p.price;
  var pct=p.vt&&p.vt.airtime?rs.airtimePct:rs.dataPct;
  return Math.max(1,Math.round(p.price*(100-pct)/100));
}
function loadRS(){
  if(!user){rs={status:"none",airtimePct:1,dataPct:1};return Promise.resolve()}
  return post("/api/reseller","status").then(function(d){
    if(d.status){rs={status:d.status,airtimePct:(d.prices||{}).airtimePct||0,dataPct:(d.prices||{}).dataPct||0}}
  }).catch(function(){});
}

/* ---------- wallet ---------- */
function drawHist(){
  $("whist").innerHTML=hist.length?hist.map(function(h){
    var buy=h.type==="buy",label=h.type==="fund"?"Wallet funded":(h.type==="refund"?"Refund":esc(h.plan||"Purchase"));
    var icon=h.type==="fund"?"\uD83D\uDCB0":(h.type==="refund"?"\u21A9\uFE0F":"\uD83D\uDED2");
    return '<div class="row"><div class="ic">'+icon+'</div><div class="m"><b>'+label+'</b><small>'+when(h.at)+'</small></div><div class="r" style="color:'+(buy?"#1b1630":"#12a36b")+'">'+(buy?"-":"+")+naira(h.amount)+'</div></div>';
  }).join(""):'<div style="color:#7a7394;font-size:14px;padding:6px 0">No wallet activity yet.</div>';
}
function setBal(b,h){balance=b||0;$("bal").textContent=money(balance);if(h){hist=h;drawHist()}}
function refreshBal(){
  if(!user)return;
  wcall("balance").then(function(d){
    if(d.error==="Not logged in"){setAuth("",null);return}
    if(d.balance!==undefined)setBal(d.balance,d.history);
  }).catch(function(){});
}
function setAuth(t,u){
  token=t||"";user=u||null;
  try{if(t){localStorage.setItem("dfng_token",t);localStorage.setItem("dfng_user",JSON.stringify(u))}else{localStorage.removeItem("dfng_token");localStorage.removeItem("dfng_user")}}catch(e){}
  drawUser();
  if(user){refreshBal();loadRS()}else{setBal(0,[]);rs={status:"none",airtimePct:1,dataPct:1}}
}
function drawUser(){
  $("hello").innerHTML="Hi, <b>"+esc(user?user.name.split(" ")[0]:"Guest")+"</b> \uD83D\uDC4B";
  $("avbtn").textContent=user?user.name.charAt(0).toUpperCase():"Log in";
  $("avbtn").className=user?"av":"av pillbtn";
  $("fundbtn").textContent=user?"Fund Wallet":"Log in / Sign up";
}
function openAuth(){amsg("");$("asheet").classList.remove("hide")}
function setTab(m){
  amode=m;$("tabIn").className=m==="in"?"on":"";$("tabUp").className=m==="up"?"on":"";
  $("nameWrap").classList.toggle("hide",m!=="up");$("ago").textContent=m==="up"?"Create account":"Log in";amsg("");
}
$("tabIn").onclick=function(){setTab("in")};
$("tabUp").onclick=function(){setTab("up")};
$("ashow").onchange=function(){$("apass").type=this.checked?"text":"password"};
$("aclose").onclick=function(){$("asheet").classList.add("hide")};
$("avbtn").onclick=function(){
  if(!user){setTab("in");openAuth();return}
  $("cname").textContent=user.name;$("cphone").textContent=user.phone;drawHist();refreshBal();$("csheet").classList.remove("hide");
};
$("cclose").onclick=function(){$("csheet").classList.add("hide")};
$("cout").onclick=function(){call("logout").catch(function(){});setAuth("",null);$("csheet").classList.add("hide")};
$("ago").onclick=function(){
  var phone=$("aphone").value.trim(),pass=$("apass").value,name=$("aname").value.trim();
  if(!/^0[789][01]\d{8}$/.test(phone))return amsg("Enter a valid 11-digit phone number.");
  if(pass.length<6)return amsg("Password must be at least 6 characters.");
  if(amode==="up"&&name.length<2)return amsg("Enter your name.");
  amsg("Please wait...");$("ago").disabled=true;
  call(amode==="up"?"signup":"login",{phone:phone,password:pass,name:name}).then(function(d){
    $("ago").disabled=false;
    if(d.error)return amsg(d.error);
    setAuth(d.token,d.user);$("asheet").classList.add("hide");$("apass").value="";amsg("");
  }).catch(function(){$("ago").disabled=false;amsg("Could not connect. Try again.")});
};
if(token){call("me").then(function(d){if(d.user)setAuth(token,d.user);else if(d.error==="Not logged in")setAuth("",null)}).catch(function(){})}

/* ---------- fund wallet ---------- */
var FAM=[500,1000,2000,5000];
function drawF(){
  $("famts").innerHTML=FAM.map(function(a){return '<button class="plan" data-a="'+a+'"><b style="margin:0">'+naira(a)+'</b></button>'}).join("");
  [].forEach.call($("famts").children,function(b){b.onclick=function(){$("famt").value=b.getAttribute("data-a")}});
}
function openFund(){
  drawF();fmsg("");
  try{if(!$("femail").value)$("femail").value=localStorage.getItem("dfng_email")||""}catch(e){}
  $("fsheet").classList.remove("hide");
}
$("fundbtn").onclick=function(){
  if(!user){setTab("up");openAuth();return}
  openFund();
};
$("fclose").onclick=function(){$("fsheet").classList.add("hide")};
function fundVerify(ref,n){
  wcall("fund",{reference:ref}).then(function(d){
    if(d.error==="Not logged in"){setAuth("",null);return}
    if(d.balance!==undefined)setBal(d.balance,d.history);
    if(d.ok&&d.credited)note("Wallet funded: "+naira(d.amount));
    else if(d.ok)note("Wallet is up to date.");
    else if(d.pending&&n<6)setTimeout(function(){fundVerify(ref,n+1)},3000);
    else if(!d.ok)note(d.message||"Could not confirm the payment yet.");
  }).catch(function(){if(n<6)setTimeout(function(){fundVerify(ref,n+1)},3000)});
}
$("fpay").onclick=function(){
  var amt=parseInt($("famt").value,10),email=$("femail").value.trim();
  if(!(amt>=100&&amt<=200000))return fmsg("Enter an amount from \u20A6100 to \u20A6200,000.");
  if(!/^\S+@\S+\.\S+$/.test(email))return fmsg("Enter a valid email address.");
  if(typeof PaystackPop==="undefined")return fmsg("Paystack failed to load. Check your connection.");
  if(!C||!/^pk_(test|live)_/.test(C.PAYSTACK_PUBLIC_KEY))return fmsg("Set your Paystack public key in lib/config.js first.");
  try{localStorage.setItem("dfng_email",email)}catch(e){}
  var ref="WAL-"+Date.now()+"-"+Math.floor(Math.random()*1e5);
  fmsg("Opening payment\u2026");
  PaystackPop.setup({
    key:C.PAYSTACK_PUBLIC_KEY,email:email,amount:amt*100,currency:C.CURRENCY,ref:ref,
    metadata:{custom_fields:[
      {display_name:"Account",variable_name:"wallet_phone",value:user.phone},
      {display_name:"Purpose",variable_name:"purpose",value:"wallet"}
    ]},
    callback:function(r){$("fsheet").classList.add("hide");fmsg("");note("Confirming your payment\u2026");fundVerify(r.reference||ref,0)},
    onClose:function(){fmsg("")}
  }).openIframe();
};

/* ---------- buy airtime / data ---------- */
function nets(){return Object.keys(P.NETWORKS).filter(function(n){return mode==="airtime"?/Airtime/.test(n):/Data/.test(n)})}
function drawChips(){
  $("chips").innerHTML=nets().map(function(n){return '<button class="chip'+(n===net?' on':'')+'" data-n="'+esc(n)+'">'+esc(n.replace(/ (Airtime|Data)$/,""))+'</button>'}).join("");
  [].forEach.call($("chips").children,function(b){b.onclick=function(){net=b.dataset.n;planId=null;drawChips();drawPlans()}});
}
function drawPlans(){
  $("plans").innerHTML=P.NETWORKS[net].map(function(p){
    var s=shown(p),old=s<p.price?'<s>'+naira(p.price)+'</s>':"";
    return '<button class="plan'+(p.id===planId?' on':'')+'" data-id="'+esc(p.id)+'">'+esc(p.label)+'<b>'+naira(s)+old+'</b></button>';
  }).join("");
  [].forEach.call($("plans").children,function(b){b.onclick=function(){planId=b.dataset.id;drawPlans()}});
}
function drawPayButtons(){
  var reseller=rs.status==="active";
  $("pay").classList.toggle("hide",reseller);
  $("wpay").classList.toggle("hide",!user||rs.status==="suspended");
  $("wpay").textContent="Pay from wallet \u00B7 "+money(balance);
  $("rnote").classList.toggle("hide",!reseller);
}
function openSheet(m){
  mode=m;net=nets()[0];planId=null;$("stitle").textContent=m==="airtime"?"Buy Airtime":"Buy Data";say("");
  if(user&&!$("phone").value)$("phone").value=user.phone;
  try{if(!$("email").value)$("email").value=localStorage.getItem("dfng_email")||""}catch(e){}
  drawPayButtons();drawChips();drawPlans();
  $("sheet").classList.remove("hide");
}

function verify(ref,pid){
  return fetch("/api/verify?reference="+encodeURIComponent(ref)+"&planId="+encodeURIComponent(pid||""))
    .then(function(r){return r.json()})
    .then(function(d){
      var st=d.status;
      if(st==="error")return;
      if(st==="failed"&&/not found|transaction reference/i.test(d.message||""))st="abandoned";
      upsert({reference:ref,status:st,verifiedAt:new Date().toISOString(),note:d.message||""});
    }).catch(function(){});
}
function mapSt(s){return s==="delivered"?"success":(s==="failed"?"failed":"pending")}
function applyOrder(o){
  upsert({reference:o.reference,status:mapSt(o.status),amount:o.amount,note:o.message||""});
}
function verifyWallet(ref,n){
  n=n||0;
  return post("/api/buy","status",{reference:ref}).then(function(d){
    if(d.error==="Order not found"){
      if(n>=2){upsert({reference:ref,status:"failed",note:"Order was not placed. You were not charged."})}
      return;
    }
    if(d.error)return;
    applyOrder(d.order);
    if(d.balance!==undefined)setBal(d.balance);
    if(d.order.status==="failed")note("Delivery failed. Your wallet was refunded.");
  }).catch(function(){});
}

function render(){
  var l=load(),shown2=showAll?l.slice(0,50):l.slice(0,5);
  $("all").textContent=showAll?"Show less":"See all";
  $("list").innerHTML=shown2.length?shown2.map(function(o){
    var title=o.plan==="Airtime"?o.network:(o.network+" "+o.plan);
    var re=o.status!=="success"?'<br><button class="re" data-r="'+esc(o.reference)+'" data-p="'+esc(o.planId)+'">Re-check</button>':"";
    return '<div class="row"><div class="ic">'+(/Airtime/.test(o.network||"")?"\uD83D\uDCDE":"\uD83D\uDCF6")+'</div><div class="m"><b>'+esc(title)+'</b><small>'+esc(o.phone)+" \u00B7 "+when(o.createdAt)+(String(o.reference).indexOf("WP-")===0?" \u00B7 wallet":"")+'</small></div><div class="r">'+naira(o.amount)+'<br><span class="pill '+esc(o.status)+'">'+esc(o.status)+'</span>'+re+'</div></div>';
  }).join(""):'<div style="color:#7a7394;font-size:14px;padding:6px 0">No transactions yet. Buy airtime or data to get started.</div>';
  [].forEach.call($("list").querySelectorAll("button[data-r]"),function(b){
    b.onclick=function(){
      b.disabled=true;
      var p=String(b.dataset.r).indexOf("WP-")===0?verifyWallet(b.dataset.r,2):verify(b.dataset.r,b.dataset.p);
      p.then(render);
    };
  });
}

$("pay").onclick=function(){
  var phone=$("phone").value.trim(),email=$("email").value.trim(),plan=planId&&P.findPlan(planId);
  if(!plan)return say("Please choose an amount.");
  if(!/^0[789][01]\d{8}$/.test(phone))return say("Enter a valid 11-digit Nigerian phone number.");
  if(!/^\S+@\S+\.\S+$/.test(email))return say("Enter a valid email address.");
  if(typeof PaystackPop==="undefined")return say("Paystack failed to load. Check your connection.");
  if(!C||!/^pk_(test|live)_/.test(C.PAYSTACK_PUBLIC_KEY))return say("Set your Paystack public key in lib/config.js first.");
  try{localStorage.setItem("dfng_email",email)}catch(e){}
  var ref="DFNG-"+Date.now()+"-"+Math.floor(Math.random()*1e5);
  upsert({reference:ref,network:plan.network,planId:plan.id,plan:plan.label,amount:plan.price,phone:phone,email:email,status:"pending",createdAt:new Date().toISOString()});
  paying=true;say("Opening payment\u2026");
  PaystackPop.setup({
    key:C.PAYSTACK_PUBLIC_KEY,email:email,amount:plan.price*100,currency:C.CURRENCY,ref:ref,
    metadata:{custom_fields:[
      {display_name:"Phone",variable_name:"phone",value:phone},
      {display_name:"Plan",variable_name:"plan",value:plan.network+" "+plan.label}
    ]},
    callback:function(r){paying=false;$("sheet").classList.add("hide");render();verify(r.reference||ref,plan.id).then(render)},
    onClose:function(){paying=false;verify(ref,plan.id).then(render)}
  }).openIframe();
  render();
};

$("wpay").onclick=function(){
  var phone=$("phone").value.trim(),plan=planId&&P.findPlan(planId);
  if(!user)return say("Log in first.");
  if(!plan)return say("Please choose an amount.");
  if(!/^0[789][01]\d{8}$/.test(phone))return say("Enter a valid 11-digit Nigerian phone number.");
  var price=shown(plan);
  if(balance<price)return say("Your wallet has "+money(balance)+". Fund your wallet first.");
  var cref=newRef(),ref="WP-"+cref;
  $("wpay").disabled=true;say("Processing\u2026");
  upsert({reference:ref,network:plan.network,planId:plan.id,plan:plan.label,amount:price,phone:phone,status:"pending",createdAt:new Date().toISOString()});
  post("/api/buy","buy",{planId:plan.id,phone:phone,clientRef:cref}).then(function(d){
    $("wpay").disabled=false;
    if(d.error){
      dropLocal(ref);say(d.error);render();
      if(d.error==="Not logged in")setAuth("",null);
      return;
    }
    applyOrder(d.order);
    if(d.balance!==undefined)setBal(d.balance);
    $("sheet").classList.add("hide");say("");render();
    if(d.order.status==="delivered")note("Done! "+d.order.plan+" sent to "+d.order.phone);
    else if(d.order.status==="failed")note("Delivery failed. Your wallet was refunded.");
    else{note("Processing. We will update the status.");setTimeout(function(){verifyWallet(ref,0).then(render)},5000)}
  }).catch(function(){
    $("wpay").disabled=false;
    say("Network problem. Check Recent transactions before trying again.");
    setTimeout(function(){verifyWallet(ref,0).then(function(){render();refreshBal()})},4000);
  });
};

/* ---------- resellers ---------- */
function rbox(h){$("rbody").innerHTML=h}
function drawReseller(d){
  if(d.status==="pending"){
    rbox('<div class="rcard"><b>Request received</b><div class="note" style="color:#e4dbff">Your reseller request is waiting for approval. You will be able to use reseller prices as soon as it is activated.</div></div><button class="go sec" id="rrefresh">Check status</button>');
    $("rrefresh").onclick=openReseller;
  }else if(d.status==="suspended"){
    rbox('<div class="rcard"><b>Reseller access suspended</b><div class="note" style="color:#e4dbff">Please contact support to find out why and how to get access back.</div></div>');
  }else{
    var ap=(d.prices||{}).airtimePct,dp=(d.prices||{}).dataPct;
    rbox('<div class="note">Become a POS reseller and buy airtime and data at lower prices to sell to your own customers.</div>'+
      '<ul class="ben"><li>Lower prices than ordinary customers'+(ap||dp?' (about '+esc(ap)+'% off airtime, '+esc(dp)+'% off data)':'')+'</li><li>Pay from your wallet &mdash; fund it first, then sell fast</li><li>Your own dashboard with sales and earnings</li><li>Failed orders are refunded to your wallet automatically</li></ul>'+
      '<label for="rname">Your business or shop name</label><input id="rname" maxlength="40" placeholder="e.g. Ada POS Centre">'+
      '<button class="go" id="rreg">Register as Reseller</button><div class="msg" id="rmsg"></div>');
    $("rreg").onclick=function(){
      var n=$("rname").value.trim();
      if(n.length<2){$("rmsg").textContent="Enter your business or shop name.";return}
      $("rreg").disabled=true;
      post("/api/reseller","register",{businessName:n}).then(function(r){
        if(r.error&&!r.status){$("rreg").disabled=false;$("rmsg").textContent=r.error;return}
        rs.status=r.status||"pending";drawReseller({status:rs.status,prices:r.prices});
        note("Request sent. We will review it.");
      }).catch(function(){$("rreg").disabled=false;$("rmsg").textContent="Could not connect. Try again."});
    };
  }
}
function drawDash(d){
  var s=d.stats||{};
  rbox('<div class="rcard"><small>'+esc(d.businessName)+' &middot; wallet balance</small><div class="amt">'+money(d.balance)+'</div><button class="fund" id="rfund">Fund Wallet</button></div>'+
    '<div class="g2"><div class="k"><small>Sales (normal value)</small><b>'+naira(s.sales||0)+'</b></div><div class="k"><small>Earnings</small><b>'+naira(s.earnings||0)+'</b></div><div class="k"><small>Spent from wallet</small><b>'+naira(s.spent||0)+'</b></div><div class="k"><small>Orders</small><b>'+(s.orders||0)+'</b></div></div>'+
    '<div class="note">Earnings = what you save compared with the normal price. Delivered '+(s.delivered||0)+' &middot; Pending '+(s.pending||0)+' &middot; Failed (refunded) '+(s.failed||0)+'.</div>'+
    '<div class="g2"><button class="go" id="rair">Buy Airtime</button><button class="go" id="rdat">Buy Data</button></div>'+
    '<h3 style="margin-top:6px">Recent sales</h3><div id="rrecent"></div>');
  $("rrecent").innerHTML=(d.recent||[]).length?d.recent.map(function(o){
    return '<div class="row"><div class="ic">'+(/Airtime/.test(o.plan)?"\uD83D\uDCDE":"\uD83D\uDCF6")+'</div><div class="m"><b>'+esc(o.plan)+'</b><small>'+esc(o.phone)+" \u00B7 "+when(o.createdAt)+'</small></div><div class="r">'+naira(o.amount)+'<br><span class="pill '+(o.status==="delivered"?"success":o.status)+'">'+esc(o.status)+'</span></div></div>';
  }).join(""):'<div class="note">No sales yet. Fund your wallet and make your first sale.</div>';
  $("rfund").onclick=function(){$("rsheet").classList.add("hide");openFund()};
  $("rair").onclick=function(){$("rsheet").classList.add("hide");openSheet("airtime")};
  $("rdat").onclick=function(){$("rsheet").classList.add("hide");openSheet("data")};
  setBal(d.balance,d.history);
}
function openReseller(){
  if(!user){setTab("up");openAuth();note("Create an account or log in first, then tap Resellers.");return}
  $("rsheet").classList.remove("hide");
  rbox('<div class="note">Loading\u2026</div>');
  post("/api/reseller","status").then(function(d){
    if(d.error==="Not logged in"){setAuth("",null);$("rsheet").classList.add("hide");return}
    if(d.error){rbox('<div class="msg">'+esc(d.error)+'</div>');return}
    rs={status:d.status,airtimePct:(d.prices||{}).airtimePct||0,dataPct:(d.prices||{}).dataPct||0};
    if(d.status==="active"){
      post("/api/reseller","dashboard").then(function(x){
        if(x.error){rbox('<div class="msg">'+esc(x.error)+'</div>');return}
        drawDash(x);
      }).catch(function(){rbox('<div class="msg">Could not load your dashboard.</div>')});
    }else drawReseller(d);
  }).catch(function(){rbox('<div class="msg">Could not connect. Try again.</div>')});
}
$("rtile").onclick=openReseller;
$("rclose").onclick=function(){$("rsheet").classList.add("hide")};

document.querySelectorAll(".tile[data-m]").forEach(function(b){b.onclick=function(){openSheet(b.dataset.m)}});
$("close").onclick=function(){$("sheet").classList.add("hide")};
$("all").onclick=function(){showAll=!showAll;render()};
$("navHome").onclick=function(){showAll=false;render();window.scrollTo(0,0)};
$("navHist").onclick=function(){showAll=true;render();$("hist").scrollIntoView()};

setInterval(function(){
  if(!paying)load().forEach(function(o){
    if(o.status==="pending"&&Date.now()-Date.parse(o.createdAt)>20000){
      tries[o.reference]=(tries[o.reference]||0)+1;
      if(tries[o.reference]<=6){
        (String(o.reference).indexOf("WP-")===0?verifyWallet(o.reference,tries[o.reference]):verify(o.reference,o.planId)).then(render);
      }
    }
  });
  render();
},6000);
setInterval(refreshBal,20000);
drawUser();
render();
if(user){refreshBal();loadRS()}
})();
</script>
